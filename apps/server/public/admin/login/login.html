<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- Shared Tabler Config -->
    <script src="/admin/shared/js/tabler-config.js" defer></script>

    <!-- Shared Admin Styles -->
    <link rel="stylesheet" href="/admin/shared/css/admin.css">

    <!-- Shared Components -->
    <script src="/admin/shared/components/admin-header.js" defer></script>

    <!-- Co-located Compiled Page Logic -->
    <script src="/admin/login/auth.js" type="module"></script>

</head>

<body class="admin-shell d-flex flex-column bg-body-tertiary">

    <admin-header type="simple"></admin-header>
    <div class="page page-center">
        <div class="container container-tight py-4">
            <div class="card card-md">
                <div class="card-body">
                    <h2 class="h2 text-center mb-4">Login to Admin Panel</h2>

                    <form id="loginForm" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email address</label>
                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="admin@example.com" value="admin@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group input-group-flat">
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="Your password" value="adminpass" required>
                                <span class="input-group-text">
                                    <button type="button" id="togglePassword"
                                        class="link-secondary border-0 bg-transparent p-0" title="Show password"
                                        aria-label="Show password">
                                        <i class="ti ti-eye-off fs-2 stroke-1.5 icon-muted" id="togglePasswordIcon"
                                            size="24"></i>
                                    </button>
                                </span>
                            </div>
                        </div>

                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary w-100">Sign in</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
