<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 - Page Not Found</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
</head>

<body class="d-flex flex-column">
    <div class="page page-center">
        <div class="container container-tight py-4">

            <div class="text-center mb-4">
                <a href="/admin/login" class="navbar-brand navbar-brand-autodark">
                    <h1 class="m-0">Admin Panel</h1>
                </a>
            </div>

            <div class="card card-md">
                <div class="card-body text-center py-5">

                    <div class="empty-header display-1 text-warning fw-bold mb-2">404</div>

                    <h2 class="h2 mb-2">Oops… You just found an error page</h2>

                    <p class="text-secondary mb-4">
                        We are sorry, but the page you are looking for was not found or has been moved.
                    </p>

                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-arrow-left me-1" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                               <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                               <path d="M5 12l14 0" />
                               <path d="M5 12l6 6" />
                               <path d="M5 12l6 -6" />
                            </svg>
                            Go Back
                        </a>
                        <a href="/admin/dashboard" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-home me-1" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                               <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                               <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
                               <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
                               <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
                            </svg>
                            Take Me Home
                        </a>
                    </div>

                </div>
            </div>

            <div class="text-center text-secondary mt-3">
                <small>
                    Think this is a bug? <a href="/admin/support" class="text-secondary underline">Report an issue</a>.
                </small>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
</body>

</html>
